# Development profile - local/dev DB settings
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@put_you_host_here:1251/sid
spring.datasource.username=username_here
spring.datasource.password=password_here

# Dev convenience credentials (override in CI/containers)
spring.security.user.name=admin
spring.security.user.password=secret
