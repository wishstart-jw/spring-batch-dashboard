spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=https://github.com/spring-projects/spring-batch/raw/refs/heads/main/spring-batch-core/src/main/resources/org/springframework/batch/core/schema-oracle10g.sql
spring.sql.init.encoding=UTF-8

# Reduce Hikari pool size for tests
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
